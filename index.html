<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#1f564b"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="吃早餐訂單"><title>吃早餐｜手機訂單管家</title><style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC",sans-serif;color:#1b3d35;background:#f5f8f5}*{box-sizing:border-box}body{margin:0;padding-bottom:92px}header{background:#1f564b;color:white;padding:22px 18px 18px}header h1{margin:0;font-size:23px}header small{opacity:.85}.wrap{padding:16px;max-width:720px;margin:auto}nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:white;border-top:1px solid #ccd9d3;padding-bottom:env(safe-area-inset-bottom)}nav button{flex:1;border:none;border-radius:0;padding:15px 2px;background:white;font-weight:bold;color:#275c50}button{cursor:pointer;font-size:15px;border:1px solid #cbd9d4;background:white;border-radius:12px;padding:11px 13px;color:#245749}button.primary{background:#1f564b;color:white;border:0}input,textarea,select{display:block;width:100%;padding:12px;margin:5px 0 12px;border:1px solid #bfcfc8;border-radius:10px;font-size:16px;background:white}label{display:block;font-size:13px;font-weight:bold}section{display:none}section.active{display:block}.card{background:white;border:1px solid #e3ebe6;border-radius:14px;padding:15px;margin-bottom:12px;box-shadow:0 2px 5px #00000008}.muted{font-size:12px;color:#668077}.row{display:flex;align-items:center;justify-content:space-between;gap:8px}.pill{background:#eff7f3;border-radius:10px;padding:8px;font-size:13px}.kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px}.kpis b{font-size:26px}h2{font-size:19px}.items{margin-top:10px}.item{border-top:1px solid #edf1ee;padding:10px 0}.note{color:#a34b31;font-size:13px}.warn{background:#fff4df;padding:10px;border-radius:9px;font-size:13px}.print-card{break-inside:avoid;width:6cm;padding:3mm;border:1px dashed #999;margin:2mm;display:inline-block;vertical-align:top;font-size:10pt;font-weight:bold}.print-card .detail{font-size:10pt;margin:3px 0}.hide{display:none!important}@media print{header,nav,.wrap>*:not(#print),.no-print{display:none!important}.wrap{padding:0;max-width:none}#print{display:block!important}#print h2,#print p,#print .controls{display:none}body{padding:0;background:white}}</style></head><body><header><h1>🥯 吃早餐｜訂單管家</h1><small>手機測試版 · 資料僅保存在這台裝置</small></header><div class="wrap">
<div class="warn">⚠️ 尚未提供登入及雲端同步。請勿在共用手機操作；請定期下載備份。此版本不會自動辨識 LINE 截圖。</div>
<section id="stats" class="active"><h2>📊 製作統計</h2><label>取餐日期<select id="filterdate" onchange="render()"></select></label><div class="kpis" id="kpis"></div><h2>貝果口味</h2><div id="bagelstats"></div><h2>其他餐點</h2><div id="otherstats"></div></section>
<section id="orders"><h2>📝 訂單明細</h2><input id="search" placeholder="搜尋客人、餐點、備註" oninput="render()"><div id="orderList"></div><h2>新增訂單</h2><form id="form"><label>客人名稱<input name="customer" required></label><label>取餐日期<input name="date" type="date" required></label><label>品項<input name="item" required></label><label>數量<input name="quantity" type="number" min="1" value="1" required></label><label>單價（不確定可留白）<input name="price" type="number" min="0"></label><label>特殊要求<textarea name="notes" rows="3"></textarea></label><button class="primary" type="submit">送出待審核</button></form></section>
<section id="review"><h2>✅ 異動審核</h2><p class="muted">所有新增、修改、取消，確認後才會改變正式訂單。</p><div id="pending"></div></section>
<section id="print"><h2>🖨️ A4 訂單卡</h2><p>每位客人／每日一張，6 公分寬、10pt 粗體。</p><div class="controls no-print"><button class="primary" onclick="window.print()">列印／另存 PDF</button></div><div id="printcards"></div></section>
<section id="backup"><h2>💾 資料備份</h2><p>本版使用 iPhone 本機儲存，不會與另一台手機或 ChatGPT 自動同步。</p><button onclick="backup()">下載完整 JSON 備份</button><label>還原備份<input type="file" id="restoreFile" accept="application/json,.json"></label><button onclick="restore()">從備份還原</button><p class="muted">請勿清除 Safari 網站資料，否則可能失去尚未備份的訂單。</p></section>
</div><nav><button onclick="go('stats')">統計</button><button onclick="go('orders')">訂單</button><button onclick="go('review')">審核</button><button onclick="go('print')">訂單卡</button><button onclick="go('backup')">備份</button></nav>
<script>
const KEY='breakfast-mobile-safe-v1';let db;try{db=JSON.parse(localStorage.getItem(KEY))||{orders:[],pending:[],audit:[]}}catch(e){db={orders:[],pending:[],audit:[]}}const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));const id=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);const bagel=s=>/貝果|蜂蜜燕麥|松露鹽之花|鐵觀音桂圓|起司三重奏|巧克力藍莓|南瓜焦糖|大甲芋頭|原味明太子/.test(s)&&!/吐司|漢堡|三明治/.test(s);const rank=s=>bagel(s)?0:/三明治/.test(s)?1:/漢堡|帕瑪森|布里歐/.test(s)?2:/吐司/.test(s)?3:/沙拉/.test(s)?4:/紅茶|咖啡|奶茶|飲料/.test(s)?5:6;const active=()=>db.orders.filter(x=>x.status==='active');const persist=()=>{try{localStorage.setItem(KEY,JSON.stringify(db))}catch(e){alert('儲存失敗，請下載備份')}};const fmt=d=>d.replaceAll('-','/');function go(name){document.querySelectorAll('section').forEach(e=>e.classList.toggle('active',e.id===name));render()}function render(){const all=active();const sel=document.querySelector('#filterdate'),prev=sel.value;const ds=[...new Set(all.map(x=>x.date))].sort();sel.innerHTML='<option value="all">全部日期</option>'+ds.map(x=>'<option>'+esc(x)+'</option>').join('');sel.value=ds.includes(prev)?prev:'all';let rows=all.filter(x=>sel.value==='all'||sel.value===x.date),bs=rows.filter(x=>bagel(x.item)),os=rows.filter(x=>!bagel(x.item));document.querySelector('#kpis').innerHTML=[['貝果',bs.reduce((s,x)=>s+x.qty,0)],['其他餐點',os.reduce((s,x)=>s+x.qty,0)],['待審核',db.pending.length],['客人',new Set(rows.map(x=>x.customer)).size]].map(x=>'<div class="card"><div class="muted">'+x[0]+'</div><b>'+x[1]+'</b></div>').join('');function group(a){const m=new Map();a.forEach(x=>m.set(x.item,(m.get(x.item)||0)+x.qty));return [...m].sort((a,b)=>b[1]-a[1]).map(x=>'<div class="card row"><span>'+esc(x[0])+'</span><b>'+x[1]+' 份</b></div>').join('')||'<p class="muted">尚無資料</p>'}document.querySelector('#bagelstats').innerHTML=group(bs);document.querySelector('#otherstats').innerHTML=group(os);const q=document.querySelector('#search').value.toLowerCase();document.querySelector('#orderList').innerHTML=all.filter(x=>(x.customer+x.item+x.notes+x.date).toLowerCase().includes(q)).map(x=>'<div class="card"><div class="row"><b>'+esc(x.customer)+'</b><span>'+esc(x.date)+'</span></div><div class="items">'+esc(x.item)+' ×'+x.qty+'｜'+(x.price===null?'價格待定':'$'+x.price)+'</div><div class="note">'+esc(x.notes)+'</div><div class="row"><button onclick="editOrder(\''+x.id+'\')">修改</button><button onclick="cancelOrder(\''+x.id+'\')">取消</button></div></div>').join('')||'<p class="muted">尚無訂單</p>';document.querySelector('#pending').innerHTML=db.pending.map(x=>{const o=x.after||x.before;return '<div class="card"><b>'+({'add':'新增','edit':'修改','cancel':'取消'}[x.type])+'｜'+esc(o.customer)+'</b><p>'+esc(o.date)+' '+esc(o.item)+' ×'+o.qty+'</p><p class="note">'+esc(o.notes)+'</p><button class="primary" onclick="approve(\''+x.id+'\')">確認</button> <button onclick="reject(\''+x.id+'\')">退回</button></div>'}).join('')||'<p>沒有待審核異動</p>';const groups=new Map();all.slice().sort((a,b)=>a.date.localeCompare(b.date)||a.customer.localeCompare(b.customer)||rank(a.item)-rank(b.item)).forEach(x=>{let k=x.date+'|'+x.customer;if(!groups.has(k))groups.set(k,[]);groups.get(k).push(x)});document.querySelector('#printcards').innerHTML=[...groups].map(([k,a])=>'<div class="print-card"><div>'+esc(k.replace('|','　'))+'</div>'+a.map(x=>'<div class="detail">'+esc(x.item)+' ×'+x.qty+(x.price===null?'':' $'+(x.price*x.qty))+(x.notes?'<div>※'+esc(x.notes)+'</div>':'')+'</div>').join('')+'</div>').join('')||'<p class="muted">沒有可列印訂單</p>'}document.querySelector('#form').addEventListener('submit',e=>{e.preventDefault();const f=new FormData(e.target);db.pending.push({id:id(),type:'add',after:{id:id(),customer:String(f.get('customer')).trim(),date:fmt(String(f.get('date'))),item:String(f.get('item')).trim(),qty:Number(f.get('quantity')),price:f.get('price')===''?null:Number(f.get('price')),notes:String(f.get('notes')||''),status:'active'}});persist();e.target.reset();go('review')});function editOrder(key){const x=db.orders.find(o=>o.id===key);if(!x)return;const str=prompt('依序修改：日期 | 品項 | 數量 | 特製備註',[x.date,x.item,x.qty,x.notes].join(' | '));if(str===null)return;let [date,item,qty,...n]=str.split('|').map(v=>v.trim());if(!date||!item||!Number.isInteger(Number(qty))||Number(qty)<1)return alert('格式不正確');db.pending.push({id:id(),type:'edit',target:key,before:{...x},after:{...x,date,item,qty:Number(qty),notes:n.join('|')}});persist();go('review')}function cancelOrder(key){const x=db.orders.find(o=>o.id===key);if(!x||!confirm('將這筆訂單送出取消審核？'))return;db.pending.push({id:id(),type:'cancel',target:key,before:{...x}});persist();go('review')}function approve(key){let i=db.pending.findIndex(x=>x.id===key);if(i<0)return;const x=db.pending[i],t=db.orders.find(o=>o.id===x.target);if(x.type==='add')db.orders.push(x.after);else if(!t)return alert('找不到原訂單');else if(x.type==='cancel')t.status='cancelled';else Object.assign(t,x.after);db.audit.push({when:new Date().toISOString(),event:x});db.pending.splice(i,1);persist();render()}function reject(key){db.pending=db.pending.filter(x=>x.id!==key);persist();render()}function backup(){const a=document.createElement('a'),u=URL.createObjectURL(new Blob([JSON.stringify(db,null,2)],{type:'application/json'}));a.href=u;a.download='吃早餐_訂單備份.json';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}async function restore(){const f=document.querySelector('#restoreFile').files[0];if(!f)return alert('請選擇 JSON');let d;try{d=JSON.parse(await f.text())}catch(e){return alert('備份檔無法解析')}if(!Array.isArray(d.orders)||!Array.isArray(d.pending))return alert('格式不符');if(!confirm('還原會取代本機資料，確定嗎？'))return;db=d;db.audit=Array.isArray(db.audit)?db.audit:[];persist();render()}render();
</script></body></html>
